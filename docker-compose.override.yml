services:
  web:
    build:
      target: dependencies
    command: ['npm', 'run', 'dev', '--workspace', 'apps/web']
    environment:
      NODE_ENV: development
      API_INTERNAL_URL: http://api:3001
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/apps/web/.next

  api:
    build:
      target: dependencies
    environment:
      NODE_ENV: development
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-japan_figure}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-japan_figure}
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:${APP_PORT:-8080}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-no-reply@japan-figure.local}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:3b-instruct}
      OLLAMA_CHAT_FALLBACK_MODEL: ${OLLAMA_CHAT_FALLBACK_MODEL:-qwen2.5:1.5b-instruct}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    command:
      [
        'sh',
        '-c',
        'npm run prisma:generate --workspace apps/api && npm run dev --workspace apps/api',
      ]

  migrate:
    build:
      target: dependencies
    command: ['npm', 'run', 'prisma:migrate', '--workspace', 'apps/api']
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules

  worker:
    build:
      target: dependencies
    command: ['npm', 'run', 'dev:worker', '--workspace', 'apps/api']
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules

  mailpit:
    ports:
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'

volumes:
  web_node_modules:
  web_next:
  api_node_modules:
