name: japan-figure

services:
  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    ports:
      - '0.0.0.0:${APP_PORT:-8081}:8080'
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:8080/nginx-health']
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 128m
    restart: unless-stopped
    networks:
      - app

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: http://api:3001
      SITE_URL: ${SITE_URL:-http://localhost:${APP_PORT:-8081}}
    volumes:
      - ./local-images:/app/local-images:ro
      - product_uploads:/app/product-uploads:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-japan_figure}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-japan_figure}
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: ${SITE_URL:-http://localhost:${APP_PORT:-8081}}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_TTL_DAYS: ${AUTH_REFRESH_TOKEN_TTL_DAYS:-30}
      AUTH_ACTION_TOKEN_TTL_HOURS: ${AUTH_ACTION_TOKEN_TTL_HOURS:-24}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-no-reply@japan-figure.local}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:3b-instruct}
      OLLAMA_CHAT_FALLBACK_MODEL: ${OLLAMA_CHAT_FALLBACK_MODEL:-qwen2.5:1.5b-instruct}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
      PRODUCT_UPLOAD_DIR: /app/product-uploads
    volumes:
      - product_uploads:/app/product-uploads
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    mem_limit: 768m
    restart: unless-stopped
    networks:
      - app

  seed:
    profiles: ['tools']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migration
    command: ['npm', 'run', 'db:seed', '--workspace', 'apps/api']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-japan_figure}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-japan_figure}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    restart: 'no'
    networks:
      - app

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'apps/api/dist/worker.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-japan_figure}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-japan_figure}
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: ${SITE_URL:-http://localhost:${APP_PORT:-8081}}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-no-reply@japan-figure.local}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:3b-instruct}
      OLLAMA_CHAT_FALLBACK_MODEL: ${OLLAMA_CHAT_FALLBACK_MODEL:-qwen2.5:1.5b-instruct}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const Redis=require('ioredis');const r=new Redis(process.env.REDIS_URL,{lazyConnect:true,connectTimeout:1500,maxRetriesPerRequest:1,retryStrategy:()=>null});r.connect().then(()=>r.ping()).then(()=>r.quit()).then(()=>process.exit(0)).catch(()=>{r.disconnect();process.exit(1)})",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 384m
    restart: unless-stopped
    networks:
      - app

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migration
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-japan_figure}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-japan_figure}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    restart: 'no'
    networks:
      - app

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-japan_figure}
      POSTGRES_USER: ${POSTGRES_USER:-japan_figure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 1536m
    restart: unless-stopped
    networks:
      - app

  redis:
    image: redis:7.4-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '192mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - app

  mailpit:
    image: axllent/mailpit:v1.22
    ports:
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    restart: unless-stopped
    networks:
      - app

volumes:
  postgres_data:
  redis_data:
  product_uploads:

networks:
  app:
    driver: bridge
